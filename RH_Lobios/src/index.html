<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lobios | Gestão em RH</title>

</head>
<body>

  <main class="login-card">
    <header class="login-card__header">
      <div class="logo">
        <svg class="logo__icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="16" r="3" fill="#ffffff"/>
          <circle cx="22" cy="7" r="3" fill="#ffffff"/>
          <circle cx="22" cy="25" r="3" fill="#ffffff"/>
          <line x1="10.4" y1="14.7" x2="19.6" y2="8.3" stroke="#ffffff" stroke-width="1.6"/>
          <line x1="10.4" y1="17.3" x2="19.6" y2="23.7" stroke="#ffffff" stroke-width="1.6"/>
        </svg>
        <span class="logo__text">Lobios</span>
      </div>
      <p class="login-card__subtitle">Gestão em RH</p>
    </header>

    <form class="login-card__body" autocomplete="off">
      <div class="field">
        <label for="login">Login:</label>
        <input type="text" id="login" name="login" placeholder="" required>
      </div>

      <div class="field">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="" required>
      </div>

      <div class="login-card__actions">
        <button class="btn-entrar" type="button" (click)="Validador()">Entrar</button>
      </div>

    </form>
  </main>
  <app-root></app-root>
</body>
</html>
