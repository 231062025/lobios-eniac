<header>
  <h2>Feedbacks</h2>
  <p class="texto-muted">Registre elogios e pontos de melhoria. A pessoa vê na área dela.</p>
</header>

<div class="dashboard-grid">
  <section class="card">
    <h3>Novo feedback</h3>
    <form (ngSubmit)="enviar()">
      <div class="form-group">
        <label for="para">Para</label>
        <select id="para" name="para" [(ngModel)]="usuarioId" required>
          <option value="" disabled>Escolha…</option>
          @for (u of equipe(); track u.id) { <option [value]="u.id">{{ u.nome }}</option> }
        </select>
      </div>
      <fieldset class="form-group escolha">
        <legend>Tipo</legend>
        <label><input type="radio" name="tipo" value="elogio" [(ngModel)]="tipo"> Elogio</label>
        <label><input type="radio" name="tipo" value="melhoria" [(ngModel)]="tipo"> Ponto de melhoria</label>
      </fieldset>
      <div class="form-group">
        <label for="texto">Mensagem</label>
        <textarea id="texto" name="texto" rows="4" [(ngModel)]="texto"
                  placeholder="Seja específico: o que aconteceu, qual o impacto e o que manter ou mudar."></textarea>
      </div>
      <button type="submit" class="btn" [disabled]="enviando()">{{ enviando() ? 'Enviando…' : 'Enviar feedback' }}</button>
    </form>
  </section>

  <section class="card span-2">
    <h3>Feedbacks que você enviou</h3>
    @if (carregando()) {
      <app-carregando />
    } @else {
      @for (f of meus(); track f.id) {
        <article class="feedback feedback--linha">
          <div>
            <p><strong>{{ cadastros.nomeUsuario(f.usuario_id) }}</strong>&nbsp;<app-status [valor]="f.tipo" /></p>
            <p>{{ f.texto }}</p>
          </div>
          <button class="btn btn-danger btn-sm" (click)="excluir(f)">Excluir</button>
        </article>
      } @empty {
        <p class="vazio">Você ainda não enviou feedbacks.</p>
      }
    }
  </section>
</div>
